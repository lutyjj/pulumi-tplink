name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: make check schema sdk-nodejs
      - name: Verify committed schema
        run: git diff --exit-code -- provider/cmd/pulumi-resource-tplink/schema.json
