name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: make check schema secret-check release-check
      - name: Verify committed schema
        run: git diff --exit-code -- provider/cmd/pulumi-resource-tplink/schema.json
  sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [nodejs, python, go, dotnet, java]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make sdk-${{ matrix.language }}
      - if: matrix.language != 'nodejs'
        run: make sdk-${{ matrix.language }}-check
