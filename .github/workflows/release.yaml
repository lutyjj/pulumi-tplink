name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [nodejs, python, go, dotnet, java]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the SDK for the tagged version
        run: make sdk-${{ matrix.language }} VERSION="${GITHUB_REF_NAME#v}"
      - if: matrix.language != 'nodejs'
        run: make sdk-${{ matrix.language }}-check VERSION="${GITHUB_REF_NAME#v}"
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tagged sources and release installation
        run: make check schema secret-check release-check VERSION="${GITHUB_REF_NAME#v}"
      - run: git diff --exit-code -- provider/cmd/pulumi-resource-tplink/schema.json
      - name: Publish plugin binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release
