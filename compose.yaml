# Short-lived tools only. Every command runs as the invoking user.
x-tool: &tool
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes: [".:/workspace"]
  working_dir: /workspace
  entrypoint: [/usr/bin/env]
  environment: &env
    HOME: /tmp
    GOPATH: /workspace/.cache/go
    GOCACHE: /workspace/.cache/go-build
    GOFLAGS: -buildvcs=false
    PULUMI_HOME: /workspace/.cache/pulumi
    PULUMI_SKIP_UPDATE_CHECK: "true"
    NUGET_PACKAGES: /workspace/.cache/nuget
    DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    GRADLE_USER_HOME: /workspace/.cache/gradle
services:
  go-tools:
    <<: *tool
    image: golang:1.26.8@sha256:0f063af2d465d8dcae54cce04278ada488b96f77b42449c8d071e47d016cc65a
  pulumi-tools:
    <<: *tool
    image: pulumi/pulumi-nodejs:3.262.0@sha256:c3abe63ad441d4cdad2cad0ac3a1341cc0862ca68787bb3568a5597d06401719
  lint-tools:
    <<: *tool
    image: golangci/golangci-lint:v2.14.0@sha256:ad862ba6b3798cbe0fd9fd7408d498fd74fbd2623a92406b2fd3898faf0bf98f
  release-tools:
    <<: *tool
    image: goreleaser/goreleaser:v2.18.2@sha256:7077423cf5ef643ff56a34b58f93c1364e927e5c3dfa470eeabc44cab1a9c72b
  schema-tools:
    <<: *tool
    image: ghcr.io/jqlang/jq:1.8.1@sha256:4f34c6d23f4b1372ac789752cc955dc67c2ae177eb1b5860b75cdc5091ce6f91
    entrypoint: [/jq]
  java-tools:
    <<: *tool
    image: gradle:8.14.4-jdk11@sha256:035d077ee5b84a75d6a03515678b85620027b557b08ca22f693fbf5162c93fa5
  sdk-python-tools:
    <<: *tool
    image: pulumi/pulumi-python:3.262.0@sha256:2151f086158d82034f869443e1514c48d7be515a9341cd85a1a525e2999d0ea4
  sdk-go-tools:
    <<: *tool
    image: pulumi/pulumi-go:3.262.0@sha256:94e9a5b229dd59bae09fdb216ccf5cbe3ffc4a36617cfe42b262115669791512
  sdk-dotnet-tools:
    <<: *tool
    image: pulumi/pulumi-dotnet:3.262.0@sha256:d4a99d23f3b6e8d82036a4202dd6577cdea3b41970674fe543a2329c479f1191
  sdk-java-tools:
    <<: *tool
    image: pulumi/pulumi-java:3.262.0@sha256:cc0f941b83d41552449257dc67c8d868011ab910cdd89a511e666576e5cd8e16
  secret-tools:
    <<: *tool
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  dotnet-tools:
    <<: *tool
